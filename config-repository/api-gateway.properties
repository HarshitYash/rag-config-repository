server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=chat-storage-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CHAT-STORAGE-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/chats/**

management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=health,info,gateway